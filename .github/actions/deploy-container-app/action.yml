# Deploys a new image to an Azure Container App, verifies the new revision
# runs that image (by digest), waits for it to be healthy, then deactivates the
# previously-active revision.
#
# A unique --revision-suffix (run id + attempt) is passed so a fresh revision
# always rolls, even when the image digest is unchanged, which sidesteps the
# silent ":latest == :latest" no-op. Callers may pass a digest ref
# (registry/repo@sha256:...) or a tag ref (registry/repo:tag); verification
# normalises both to a digest.
#
# The health gate polls the new revision and then GETs the app's public custom
# domain, because the *.azurecontainerapps.io origin only admits Cloudflare. If
# the gate fails the previous revision is restored (traffic shift in Multiple
# mode, previous image redeploy in Single mode) and is never deactivated.
#
# Assumes azure/login has already been called in an earlier step and that the
# repository is checked out.
name: Deploy Container App
description: Update a Container App, verify and health-check the new revision, roll back on failure, then deactivate the old revision

inputs:
  app-name:
    description: Container App name (e.g., ca-town-crier-api-dev)
    required: true
  resource-group:
    description: Azure resource group
    required: true
  image:
    description: >-
      Full image reference — digest ref (myregistry.azurecr.io/app@sha256:…,
      preferred) or tag ref (myregistry.azurecr.io/app:sha). Verification
      normalises either form to a digest.
    required: true
  health-url:
    description: >-
      URL to GET after the revision is ready. Defaults to
      https://<first custom domain>/health read from the app.
    required: false
    default: ''

outputs:
  old-revision:
    description: The revision that was deactivated (empty if none)
    value: ${{ steps.old-revision.outputs.revision }}

runs:
  using: composite
  steps:
    - name: Record current state
      id: old-revision
      shell: bash
      env:
        APP: ${{ inputs.app-name }}
        RG: ${{ inputs.resource-group }}
        HEALTH_URL_INPUT: ${{ inputs.health-url }}
      run: |
        set -euo pipefail
        REV=$(az containerapp ingress traffic show \
          --name "$APP" --resource-group "$RG" \
          --query "[?weight==\`100\`].revisionName | [0]" -o tsv)
        if [ -z "$REV" ]; then
          REV=$(az containerapp show --name "$APP" --resource-group "$RG" \
            --query "properties.latestReadyRevisionName" -o tsv)
        fi
        MODE=$(az containerapp show --name "$APP" --resource-group "$RG" \
          --query "properties.configuration.activeRevisionsMode" -o tsv)
        # The serving revision's image, not the template's: after a failed deploy
        # the template can hold the bad image.
        if [ -n "$REV" ]; then
          IMAGE=$(az containerapp revision show --name "$APP" --resource-group "$RG" \
            --revision "$REV" --query "properties.template.containers[0].image" -o tsv)
        else
          IMAGE=$(az containerapp show --name "$APP" --resource-group "$RG" \
            --query "properties.template.containers[0].image" -o tsv)
        fi
        URL="$HEALTH_URL_INPUT"
        if [ -z "$URL" ]; then
          DOMAIN=$(az containerapp show --name "$APP" --resource-group "$RG" \
            --query "properties.configuration.ingress.customDomains[0].name" -o tsv)
          [ -n "$DOMAIN" ] && URL="https://${DOMAIN}/health"
        fi
        {
          echo "revision=$REV"
          echo "mode=$MODE"
          echo "image=$IMAGE"
          echo "health-url=$URL"
        } >> "$GITHUB_OUTPUT"

    - name: Deploy new image
      id: deploy
      shell: bash
      env:
        APP: ${{ inputs.app-name }}
        RG: ${{ inputs.resource-group }}
        IMAGE: ${{ inputs.image }}
        MODE: ${{ steps.old-revision.outputs.mode }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        set -euo pipefail
        # ACA suffix rules: lowercase [a-z0-9-], start alphabetic; the leading
        # 'r' guarantees that and the run id/attempt are numeric.
        SUFFIX="r${RUN_ID}-${RUN_ATTEMPT}"
        SUFFIX="$(printf '%s' "$SUFFIX" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-')"
        az containerapp update \
          --name "$APP" \
          --resource-group "$RG" \
          --image "$IMAGE" \
          --revision-suffix "$SUFFIX"
        # A rollback pins traffic to a fixed revision. Route to the latest ready
        # revision again, or the health gate would GET the pinned old revision.
        if [ "${MODE,,}" = "multiple" ]; then
          az containerapp ingress traffic set --name "$APP" --resource-group "$RG" \
            --revision-weight latest=100
        fi
        echo "revision=${APP}--${SUFFIX}" >> "$GITHUB_OUTPUT"

    - name: Verify new revision runs the deployed image
      shell: bash
      env:
        APP: ${{ inputs.app-name }}
        RG: ${{ inputs.resource-group }}
        WANT_REF: ${{ inputs.image }}
        NEW_REVISION: ${{ steps.deploy.outputs.revision }}
      run: |
        set -euo pipefail

        # A digest ref is returned as-is; a tag ref is resolved against ACR.
        digest_of() {
          local ref="$1" server registry repo_ref
          case "$ref" in
            *@sha256:*)
              printf '%s' "${ref##*@}"
              ;;
            *)
              server="${ref%%/*}"
              registry="${server%%.*}"
              repo_ref="${ref#*/}"
              az acr repository show \
                --name "$registry" \
                --image "$repo_ref" \
                --query digest -o tsv
              ;;
          esac
        }

        WANT_DIGEST="$(digest_of "$WANT_REF")"

        RUNNING_REF="$(az containerapp revision show \
          --name "$APP" \
          --resource-group "$RG" \
          --revision "$NEW_REVISION" \
          --query "properties.template.containers[0].image" -o tsv)"

        GOT_DIGEST="$(digest_of "$RUNNING_REF")"

        echo "Deployed image  : $WANT_REF"
        echo "Wanted digest   : $WANT_DIGEST"
        echo "New revision    : $NEW_REVISION"
        echo "Running image   : $RUNNING_REF"
        echo "Running digest  : $GOT_DIGEST"

        if [ -z "$WANT_DIGEST" ] || [ -z "$GOT_DIGEST" ]; then
          echo "::error::Could not resolve image digests (want='$WANT_DIGEST' got='$GOT_DIGEST')"
          exit 1
        fi

        if [ "$WANT_DIGEST" != "$GOT_DIGEST" ]; then
          echo "::error::Deploy did not take: revision $NEW_REVISION runs $GOT_DIGEST but we deployed $WANT_DIGEST"
          exit 1
        fi

        echo "Verified: revision $NEW_REVISION runs the deployed digest."

    - name: Wait for healthy revision
      id: health
      shell: bash
      env:
        MODE_ARG: check
        APP: ${{ inputs.app-name }}
        RG: ${{ inputs.resource-group }}
        NEW_REVISION: ${{ steps.deploy.outputs.revision }}
        HEALTH_URL: ${{ steps.old-revision.outputs.health-url }}
        TIMEOUT_SECONDS: '300'
      run: bash "$GITHUB_WORKSPACE/.github/scripts/revision-health-gate.sh"

    - name: Restore previous revision
      if: failure() && steps.deploy.outcome == 'success'
      shell: bash
      env:
        MODE_ARG: rollback
        APP: ${{ inputs.app-name }}
        RG: ${{ inputs.resource-group }}
        REVISION_MODE: ${{ steps.old-revision.outputs.mode }}
        PREVIOUS_REVISION: ${{ steps.old-revision.outputs.revision }}
        PREVIOUS_IMAGE: ${{ steps.old-revision.outputs.image }}
      run: bash "$GITHUB_WORKSPACE/.github/scripts/revision-health-gate.sh"

    - name: Deactivate old revision
      if: steps.old-revision.outputs.revision != '' && steps.old-revision.outputs.revision != steps.deploy.outputs.revision
      shell: bash
      env:
        APP: ${{ inputs.app-name }}
        RG: ${{ inputs.resource-group }}
        OLD_REVISION: ${{ steps.old-revision.outputs.revision }}
      run: |
        az containerapp revision deactivate \
          --name "$APP" \
          --resource-group "$RG" \
          --revision "$OLD_REVISION" || true
