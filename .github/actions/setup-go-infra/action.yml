# Sets up Go (via infra/go.mod), the Pulumi CLI, and caches Go modules for the
# infra Pulumi program. Third-party actions are pinned by commit SHA.
name: Setup Go & Pulumi for Infra
description: Install Go, the Pulumi CLI, and cache Go modules for the infra Pulumi program

runs:
  using: composite
  steps:
    - name: Setup Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: infra/go.mod
        cache-dependency-path: infra/go.sum

    - name: Install Pulumi CLI
      shell: bash
      env:
        PULUMI_VERSION: 3.242.0
        PULUMI_SHA256: 1aa7d15970564be2c04c5872e6041669c03020f279c7197e3a1a1159a73bddf3
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS" != "Linux" ] || [ "$RUNNER_ARCH" != "X64" ]; then
          echo "::error::Pulumi install supports Linux x64 only (got $RUNNER_OS $RUNNER_ARCH)"
          exit 1
        fi
        curl -fsSL -o "$RUNNER_TEMP/pulumi.tar.gz" \
          "https://github.com/pulumi/pulumi/releases/download/v${PULUMI_VERSION}/pulumi-v${PULUMI_VERSION}-linux-x64.tar.gz"
        echo "${PULUMI_SHA256}  $RUNNER_TEMP/pulumi.tar.gz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/pulumi.tar.gz" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/pulumi" >> "$GITHUB_PATH"
