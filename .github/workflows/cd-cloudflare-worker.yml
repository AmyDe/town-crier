# Deploys the apex Cloudflare Worker (cloudflare/apex-worker) with wrangler.
# dev on push to main touching the Worker, prod on a v* tag. Manual runs can
# deploy either env or roll it back to the previous Worker version.
#
# Third-party actions pinned to commit SHA for supply-chain safety
# (tj-actions CVE-2025-30066 rationale — issue #835 slice 4).
#
# Requires repo-level secrets:
#   CLOUDFLARE_API_TOKEN   — Workers Scripts: Edit, Workers Routes: Edit and DNS: Edit on towncrierapp.uk
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account id
#
# Requires GitHub Environments (secret SITE_BUILD_KEY set on each, the same
# value cd-dev.yml / cd-prod.yml use for the build key):
#   development            — dev deploys
#   production             — prod deploys

name: CD Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/apex-worker/**"
      - ".github/workflows/cd-cloudflare-worker.yml"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      env:
        description: "Worker environment"
        type: choice
        required: true
        options:
          - dev
          - prod
      rollback:
        description: "Roll back to the previous Worker version instead of deploying"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      env: ${{ steps.plan.outputs.env }}
      rollback: ${{ steps.plan.outputs.rollback }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_ENV: ${{ inputs.env }}
          INPUT_ROLLBACK: ${{ inputs.rollback }}
        run: |
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            target="$INPUT_ENV"
            rollback="$INPUT_ROLLBACK"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            target=prod
            rollback=false
          else
            target=dev
            rollback=false
          fi
          echo "env=$target" >> "$GITHUB_OUTPUT"
          echo "rollback=$rollback" >> "$GITHUB_OUTPUT"

  test:
    name: Worker tests
    needs: plan
    if: needs.plan.outputs.rollback != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/apex-worker/package-lock.json
      - run: npm ci
        working-directory: cloudflare/apex-worker
      - run: npx tsc --noEmit
        working-directory: cloudflare/apex-worker
      - run: npx vitest run
        working-directory: cloudflare/apex-worker

  deploy:
    name: ${{ needs.plan.outputs.rollback == 'true' && 'Roll back' || 'Deploy' }} Worker (${{ needs.plan.outputs.env }})
    needs: [plan, test]
    if: always() && needs.plan.result == 'success' && (needs.test.result == 'success' || needs.plan.outputs.rollback == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ needs.plan.outputs.env == 'prod' && 'production' || 'development' }}
    concurrency:
      group: cd-cloudflare-worker-${{ needs.plan.outputs.env }}
      cancel-in-progress: false
    steps:
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Repo secret $name is empty or missing. Create the Cloudflare API token and add both secrets before deploying the Worker."
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Deploy Worker
        if: needs.plan.outputs.rollback != 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        env:
          SITE_BUILD_KEY: ${{ secrets.SITE_BUILD_KEY }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.148.0
          workingDirectory: cloudflare/apex-worker
          environment: ${{ needs.plan.outputs.env }}
          secrets: |
            SITE_BUILD_KEY
          command: deploy --env ${{ needs.plan.outputs.env }}
      - name: Roll back Worker
        if: needs.plan.outputs.rollback == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.148.0
          workingDirectory: cloudflare/apex-worker
          command: rollback --env ${{ needs.plan.outputs.env }} --message "Rollback via workflow run ${{ github.run_id }}" --yes
