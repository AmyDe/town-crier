[env.prod]
name = "town-crier-apex-prod"
workers_dev = false
routes = [{ pattern = "preview.towncrierapp.uk", custom_domain = true }]

[env.prod.vars]
SWA_ORIGIN = "https://calm-river-03a6ccb03.1.azurestaticapps.net"
