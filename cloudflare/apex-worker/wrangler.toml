workers_dev = false

[env.dev]
name = "town-crier-apex-dev"
workers_dev = false
routes = [{ pattern = "preview-dev.towncrierapp.uk", custom_domain = true }]

[env.dev.vars]
SWA_ORIGIN = "https://lemon-sand-07669da03.6.azurestaticapps.net"
